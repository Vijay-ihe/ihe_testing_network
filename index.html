<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>IHE Delft Alumni Global Network</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:#f3f6fb;
color:#1e2a3a;
}

/* HEADER */
.header{
background:linear-gradient(120deg,#1b3a6b,#1e5aa8);
padding:40px 60px;
color:white;
position:relative;
}

.header h1{
margin:0;
font-size:36px;
font-weight:700;
}

.header p{
margin-top:8px;
opacity:0.9;
}

.logo{
position:absolute;
right:60px;
top:40px;
text-align:right;
}

.logo strong{font-size:22px;}
.logo small{font-size:13px;opacity:0.8;display:block;}

/* MAP */
.map-wrapper{
padding:40px 60px;
}

svg{
width:100%;
height:auto;
}

/* CONTINENT COLORS */
.americas{fill:#f4c6c6;}
.europe{fill:#c7dcf5;}
.africa{fill:#d7eac3;}
.asia{fill:#f7e2a4;}
.oceania{fill:#e6d3f7;}

.country-outline{
stroke:white;
stroke-width:0.6;
}

/* BUBBLES */
.bubble{
cursor:pointer;
transition:0.2s;
}

.bubble:hover{
transform:scale(1.2);
}

.red{fill:#e53935;}
.orange{fill:#fb8c00;}
.green{fill:#43a047;}
.blue{fill:#1e88e5;}
.purple{fill:#8e24aa;}

.bubble-text{
fill:white;
font-weight:600;
font-size:14px;
text-anchor:middle;
dominant-baseline:middle;
pointer-events:none;
}

/* TOOLTIP */
.tooltip{
position:absolute;
background:white;
padding:8px 12px;
border-radius:8px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
font-size:13px;
display:none;
}

</style>
</head>

<body>

<div class="header">
<h1>IHE Delft Alumni Global Network</h1>
<p>Building Water Solutions for a Sustainable World</p>

<div class="logo">
<strong>IHE DELFT</strong>
<small>Institute for Water Education</small>
</div>
</div>

<div class="map-wrapper">

<svg viewBox="0 0 1200 600">

<!-- Real world outline simplified by continent groups -->

<!-- AMERICAS -->
<path class="americas country-outline"
d="M80,200 L180,160 L260,190 L240,260 L190,320 L120,300 Z
   M200,320 L250,340 L230,390 L170,380 Z"/>

<!-- EUROPE -->
<path class="europe country-outline"
d="M520,180 L580,160 L630,190 L600,230 L540,220 Z"/>

<!-- AFRICA -->
<path class="africa country-outline"
d="M520,230 L600,240 L630,340 L550,390 L500,330 Z"/>

<!-- ASIA -->
<path class="asia country-outline"
d="M630,150 L950,150 L980,300 L700,320 L630,250 Z"/>

<!-- OCEANIA -->
<path class="oceania country-outline"
d="M950,350 L1050,360 L1030,420 L930,410 Z"/>

<!-- BUBBLES positioned geographically -->
<circle cx="565" cy="195" r="25" class="bubble red"/>
<text x="565" y="195" class="bubble-text">55</text>

<circle cx="180" cy="250" r="22" class="bubble orange"/>
<text x="180" y="250" class="bubble-text">48</text>

<circle cx="750" cy="260" r="28" class="bubble red"/>
<text x="750" y="260" class="bubble-text">63</text>

<circle cx="600" cy="300" r="22" class="bubble orange"/>
<text x="600" y="300" class="bubble-text">40</text>

<circle cx="560" cy="350" r="18" class="bubble blue"/>
<text x="560" y="350" class="bubble-text">29</text>

</svg>

</div>

<div class="tooltip" id="tooltip"></div>

<script>

const tooltip = document.getElementById("tooltip");

document.querySelectorAll(".bubble").forEach(b=>{
b.addEventListener("mouseenter",(e)=>{
tooltip.style.display="block";
tooltip.innerHTML="Click for country details";
});
b.addEventListener("mousemove",(e)=>{
tooltip.style.left=e.pageX+10+"px";
tooltip.style.top=e.pageY+10+"px";
});
b.addEventListener("mouseleave",()=>{
tooltip.style.display="none";
});
b.addEventListener("click",()=>{
alert("Country detail panel coming soon.");
});
});

</script>

</body>
</html>
