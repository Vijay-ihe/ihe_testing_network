<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHE Delft Alumni Global Network</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Inter', sans-serif;
background: #f4f7fb;
color: #1e2a38;
}

/* ================= HEADER ================= */

.hero {
background: linear-gradient(135deg,#163a6b 0%,#1f4e8a 50%,#1a6aa3 100%);
padding: 80px 0 120px 0;
position: relative;
}

.container {
width: 90%;
max-width: 1400px;
margin: auto;
}

.hero-grid {
display: grid;
grid-template-columns: 1fr auto;
align-items: start;
}

.hero-title h1 {
color: white;
font-size: 42px;
font-weight: 800;
letter-spacing: -0.5px;
}

.hero-title p {
color: rgba(255,255,255,0.85);
margin-top: 14px;
font-size: 17px;
}

/* LOGO */
.hero-logo img {
height: 80px;
}

/* KPI CARDS */
.kpi-wrapper {
display: flex;
gap: 30px;
margin-top: 60px;
}

.kpi-card {
background: white;
padding: 24px 36px;
border-radius: 20px;
box-shadow: 0 20px 50px rgba(0,0,0,0.25);
min-width: 170px;
text-align: center;
transition: 0.3s ease;
}

.kpi-card:hover {
transform: translateY(-5px);
box-shadow: 0 25px 60px rgba(0,0,0,0.35);
}

.kpi-number {
font-size: 30px;
font-weight: 800;
color: #1f4e8a;
}

.kpi-label {
margin-top: 6px;
font-size: 14px;
color: #444;
}

/* ================= MAP SECTION ================= */

.map-section {
margin-top: -70px;
padding-bottom: 80px;
}

.map-box {
width: 90%;
max-width: 1400px;
margin: auto;
background: white;
border-radius: 25px;
box-shadow: 0 30px 80px rgba(0,0,0,0.15);
padding: 30px;
}

#map {
height: 550px;
border-radius: 20px;
}

/* ================= FOOTER ================= */

.footer {
background: #163a6b;
color: white;
padding: 25px 0;
text-align: center;
font-size: 14px;
}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<!-- ================= HERO ================= -->

<section class="hero">
<div class="container">

<div class="hero-grid">

<div class="hero-title">
<h1>IHE Delft Alumni Global Network</h1>
<p>Building Water Solutions for a Sustainable World</p>

<div class="kpi-wrapper">
<div class="kpi-card">
<div class="kpi-number">744</div>
<div class="kpi-label">Total Alumni</div>
</div>

<div class="kpi-card">
<div class="kpi-number">218</div>
<div class="kpi-label">Current Students</div>
</div>

<div class="kpi-card">
<div class="kpi-number">45+</div>
<div class="kpi-label">Countries</div>
</div>
</div>

</div>

<div class="hero-logo">
<img src="ihe-logo.svg" alt="IHE Delft Logo">
</div>

</div>
</div>
</section>

<!-- ================= MAP ================= -->

<section class="map-section">
<div class="map-box">
<div id="map"></div>
</div>
</section>

<!-- ================= FOOTER ================= -->

<footer class="footer">
Together for water. Together for the future.
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
maxZoom: 6
}).addTo(map);

function getColor(val){
if(val > 50) return "#e53935";
if(val > 30) return "#fb8c00";
if(val > 10) return "#43a047";
return "#1e88e5";
}

var data = [
{name:"Netherlands",lat:52,lng:5,count:55},
{name:"USA",lat:37,lng:-95,count:48},
{name:"India",lat:22,lng:78,count:63},
{name:"Germany",lat:51,lng:10,count:40},
{name:"South Africa",lat:-29,lng:24,count:29}
];

data.forEach(d=>{
L.circleMarker([d.lat,d.lng],{
radius:Math.sqrt(d.count)*2,
fillColor:getColor(d.count),
color:"#fff",
weight:2,
fillOpacity:0.9
}).addTo(map)
.bindPopup("<b>"+d.name+"</b><br>Alumni: "+d.count);
});
</script>

</body>
</html>
