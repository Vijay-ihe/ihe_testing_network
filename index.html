<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IHE Delft Alumni Global Network</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f4f7fb;color:#1e2a38}

/* ===== HEADER ===== */
.header{
position:relative;
background:linear-gradient(180deg,#f4f7fb 0%,#e9eff6 100%);
padding:70px 80px 120px 80px;
overflow:hidden;
}

.header h1{
font-size:40px;
font-weight:800;
color:#1f3e73;
}

.header p{
margin-top:10px;
color:#3c5f8f;
font-size:16px;
}

.logo{
position:absolute;
right:80px;
top:60px;
}

.logo img{
height:85px;
}

/* Subtle Wave */
.wave{
position:absolute;
bottom:-40px;
left:0;
width:100%;
}

/* KPI */
.kpis{
display:flex;
gap:30px;
margin-top:50px;
}

.kpi{
background:white;
padding:22px 36px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
min-width:160px;
text-align:center;
}

.kpi h2{
font-size:28px;
font-weight:800;
color:#1f4e8a;
}

.kpi span{
display:block;
margin-top:6px;
font-size:14px;
color:#444;
}

/* ===== MAP ===== */
.map-wrapper{
width:90%;
max-width:1400px;
margin:-80px auto 60px auto;
background:white;
border-radius:25px;
box-shadow:0 30px 80px rgba(0,0,0,0.15);
padding:30px;
}

#map{
height:600px;
border-radius:20px;
}

/* Custom zoom buttons */
.leaflet-control-zoom{
border:none;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
border-radius:12px;
overflow:hidden;
}

/* ===== FOOTER ===== */
.footer{
background:#153b72;
color:white;
padding:20px;
text-align:center;
font-size:14px;
}
</style>
</head>

<body>

<div class="header">
<h1>IHE Delft Alumni Global Network</h1>
<p>Building Water Solutions for a Sustainable World</p>

<div class="logo">
<img src="ihe-delft-institute_unesco_rgb_2.png" alt="IHE Delft Logo">
</div>

<div class="kpis">
<div class="kpi">
<h2>744</h2>
<span>Total Alumni</span>
</div>

<div class="kpi">
<h2>218</h2>
<span>Current Students</span>
</div>

<div class="kpi">
<h2>45+</h2>
<span>Countries</span>
</div>
</div>

<!-- Wave SVG -->
<svg class="wave" viewBox="0 0 1440 320">
<path fill="#dfe8f4" fill-opacity="1"
d="M0,224L80,218.7C160,213,320,203,480,197.3C640,192,800,192,960,197.3C1120,203,1280,213,1360,218.7L1440,224V320H0Z">
</path>
</svg>

</div>

<div class="map-wrapper">
<div id="map"></div>
</div>

<div class="footer">
Together for water. Together for the future.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map',{
zoomControl:true,
scrollWheelZoom:true
}).setView([20,0],2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
maxZoom:6
}).addTo(map);

function bubbleColor(v){
if(v>50) return "#e53935";
if(v>30) return "#fb8c00";
if(v>10) return "#43a047";
return "#1e88e5";
}

function bubbleGlow(color){
return {
radius:12,
fillColor:color,
color:"#fff",
weight:2,
fillOpacity:0.95
}
}

var countries=[
{name:"USA",lat:37,lng:-95,count:48},
{name:"Netherlands",lat:52,lng:5,count:55},
{name:"India",lat:22,lng:78,count:63},
{name:"Germany",lat:51,lng:10,count:40},
{name:"South Africa",lat:-29,lng:24,count:29}
];

countries.forEach(c=>{
L.circleMarker([c.lat,c.lng],bubbleGlow(bubbleColor(c.count)))
.addTo(map)
.bindPopup("<b>"+c.name+"</b><br>Alumni: "+c.count);
});
</script>

</body>
</html>
